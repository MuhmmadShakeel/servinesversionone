<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>jobNshop API Documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.33.2/swagger-ui.css" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f6f8fc; color: #17233b; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .docs-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px clamp(20px, 4vw, 64px); background: #111827; color: #fff; }
      .docs-brand { display: flex; align-items: center; gap: 14px; }
      .docs-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #8059ff, #35b488); font-size: 23px; font-weight: 900; }
      .docs-brand strong { display: block; font-size: 17px; letter-spacing: -.02em; }
      .docs-brand span { display: block; margin-top: 2px; color: #aebad0; font-size: 12px; }
      .docs-header a { color: #d7e2ff; font-size: 13px; font-weight: 700; text-decoration: none; }
      .docs-header a:hover { color: #fff; text-decoration: underline; }
      .docs-intro { max-width: 1180px; margin: 32px auto 8px; padding: 0 24px; }
      .docs-intro h1 { margin: 0 0 7px; font-size: clamp(26px, 3vw, 38px); letter-spacing: -.04em; }
      .docs-intro p { margin: 0; color: #60718d; font-size: 14px; line-height: 1.6; }
      #docs-status { max-width: 1180px; margin: 28px auto; padding: 0 24px; color: #60718d; font-size: 14px; }
      #swagger-ui { max-width: 1220px; margin: 0 auto; padding: 0 12px 48px; }
      .swagger-ui .topbar { display: none; }
      .swagger-ui .info { margin: 22px 0; }
      .swagger-ui .scheme-container { border-radius: 14px; box-shadow: 0 6px 20px #17233b10; }
      .swagger-ui .opblock { border-radius: 10px; overflow: hidden; box-shadow: 0 3px 12px #17233b0a; }
      .fallback { max-width: 1180px; margin: 24px auto 70px; padding: 0 24px; }
      .fallback-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; }
      .fallback-search { width: 100%; padding: 13px 16px; border: 1px solid #dce3ee; border-radius: 11px; background: #fff; color: #17233b; font: inherit; }
      .fallback-count { white-space: nowrap; color: #60718d; font-size: 13px; }
      .fallback-group { margin: 25px 0; }
      .fallback-group h2 { margin: 0 0 12px; font-size: 19px; }
      .fallback-operation { margin: 8px 0; border: 1px solid #e0e6ef; border-radius: 10px; background: #fff; overflow: hidden; }
      .fallback-operation summary { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; list-style: none; }
      .fallback-operation summary::-webkit-details-marker { display: none; }
      .fallback-operation summary:hover { background: #f7f9fd; }
      .fallback-method { min-width: 66px; padding: 5px 7px; border-radius: 6px; background: #e9f4ff; color: #1764ac; text-align: center; font-size: 11px; font-weight: 800; }
      .fallback-method.post { background: #e5f8ef; color: #087b4a; }
      .fallback-method.put, .fallback-method.patch { background: #fff2df; color: #a45d00; }
      .fallback-method.delete { background: #ffebed; color: #be2837; }
      .fallback-path { font: 600 13px ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
      .fallback-summary { margin-left: auto; color: #60718d; font-size: 13px; text-align: right; }
      .fallback-detail { padding: 4px 18px 20px; border-top: 1px solid #e8edf4; font-size: 13px; line-height: 1.6; }
      .fallback-detail h3 { margin: 16px 0 6px; font-size: 14px; }
      .fallback-detail pre { overflow: auto; padding: 12px; border-radius: 8px; background: #f2f5fa; font-size: 12px; }
      .fallback-detail p { margin: 7px 0; }
      .fallback-link { color: #5b42c8; }
      @media (max-width: 600px) { .docs-header { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <header class="docs-header">
      <div class="docs-brand"><div class="docs-mark" aria-hidden="true">J</div><div><strong>jobNshop API</strong><span>Interactive developer documentation</span></div></div>
      <a href="/">Back to jobNshop</a>
    </header>
    <main>
      <div class="docs-intro"><h1>Build with jobNshop</h1><p>Explore every endpoint, inspect request and response schemas, and authorize a session to try the API.</p></div>
      <div id="docs-status" role="status">Loading API documentation...</div>
      <div id="swagger-ui"></div>
    </main>
    <script src="https://unpkg.com/swagger-ui-dist@5.33.2/swagger-ui-bundle.js" crossorigin="anonymous"></script>
    <script>
      function renderFallback(specification) {
        const escape = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
        const operations = Object.entries(specification.paths || {}).flatMap(([path, methods]) =>
          Object.entries(methods).filter(([method]) => /^(get|post|put|patch|delete|options|head)$/.test(method)).map(([method, operation]) => ({ path, method, operation, tag: operation.tags?.[0] || 'Other' }))
        );
        const container = document.getElementById('swagger-ui');
        container.innerHTML = '<div class="fallback"><div class="fallback-toolbar"><input class="fallback-search" type="search" placeholder="Search endpoints, paths, or descriptions" aria-label="Search API endpoints"><span class="fallback-count"></span></div><div class="fallback-results"></div><p><a class="fallback-link" href="/docs/swagger.json">Download the complete OpenAPI specification</a></p></div>';
        const search = container.querySelector('.fallback-search');
        const results = container.querySelector('.fallback-results');
        const count = container.querySelector('.fallback-count');
        function draw() {
          const query = search.value.trim().toLowerCase();
          const matching = operations.filter(({ path, method, operation, tag }) => `${path} ${method} ${tag} ${operation.summary || ''} ${operation.description || ''}`.toLowerCase().includes(query));
          count.textContent = `${matching.length} endpoints`;
          const groups = new Map();
          matching.forEach((entry) => groups.set(entry.tag, [...(groups.get(entry.tag) || []), entry]));
          results.innerHTML = [...groups].map(([tag, entries]) => `<section class="fallback-group"><h2>${escape(tag)}</h2>${entries.map(({ path, method, operation }) => {
            const sections = [
              operation.description && `<p>${escape(operation.description)}</p>`,
              operation.security && `<h3>Security</h3><pre>${escape(JSON.stringify(operation.security, null, 2))}</pre>`,
              operation.parameters?.length && `<h3>Parameters</h3><pre>${escape(JSON.stringify(operation.parameters, null, 2))}</pre>`,
              operation.requestBody && `<h3>Request body</h3><pre>${escape(JSON.stringify(operation.requestBody, null, 2))}</pre>`,
              operation.responses && `<h3>Responses</h3><pre>${escape(JSON.stringify(operation.responses, null, 2))}</pre>`,
            ].filter(Boolean).join('');
            return `<details class="fallback-operation"><summary><span class="fallback-method ${escape(method)}">${escape(method.toUpperCase())}</span><span class="fallback-path">${escape(path)}</span><span class="fallback-summary">${escape(operation.summary || '')}</span></summary><div class="fallback-detail">${sections}</div></details>`;
          }).join('')}</section>`).join('') || '<p>No matching endpoints.</p>';
        }
        search.addEventListener('input', draw);
        draw();
      }
      async function loadDocs() {
        const status = document.getElementById('docs-status');
        try {
          const response = await fetch('/docs/swagger.json', { cache: 'no-store' });
          if (!response.ok) throw new Error(`Specification returned ${response.status}`);
          const specification = await response.json();
          specification.servers = [
            { url: window.location.origin, description: 'This site (local Vite API proxy)' },
            ...(specification.servers || []),
          ];
          if (!window.SwaggerUIBundle) {
            renderFallback(specification);
            status.textContent = 'Swagger UI assets are unavailable. Showing the complete searchable API reference.';
            return;
          }
          window.SwaggerUIBundle({
            spec: specification,
            dom_id: '#swagger-ui',
            deepLinking: true,
            docExpansion: 'list',
            defaultModelsExpandDepth: 1,
            displayRequestDuration: true,
            persistAuthorization: true,
            tryItOutEnabled: false,
          });
          status.remove();
        } catch (error) {
          status.textContent = `Documentation could not load: ${error.message}. Check the browser connection and reload this page.`;
        }
      }
      window.addEventListener('load', loadDocs);
    </script>
  </body>
</html>
